<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wat at ik?</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background: #219653;
        }
        .entry {
            background: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid #27ae60;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .entry-time {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .entry-text {
            font-size: 16px;
            white-space: pre-wrap;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn-secondary {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            width: auto;
        }
    </style>
</head>
<body>

    <h2>Eetmomenten Logboek</h2>

    <div class="card">
        <label for="etenInput" style="font-weight: bold; display: block; margin-bottom: 8px;">Wat heb je gegeten / gedronken?</label>
        <textarea id="etenInput" placeholder="Typ hier wat je op dit moment eet..."></textarea>
        <button onclick="slaEtenOp()">Opslaan</button>
    </div>

    <h3>Eerdere momenten</h3>
    <div id="lijstContainer"></div>

    <div class="actions">
        <button class="btn-secondary" onclick="wisAlles()">Alles wissen</button>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", laadEten);

    function slaEtenOp() {
        const input = document.getElementById('etenInput');
        const tekst = input.value.trim();
        
        if (!tekst) {
            alert("Typ eerst even wat je hebt gegeten.");
            return;
        }

        const nu = new Date();
        const datumTijd = nu.toLocaleString('nl-NL', { 
            weekday: 'short', 
            day: 'numeric', 
            month: 'short', 
            hour: '2-digit', 
            minute: '2-digit' 
        });

        const nieuweItem = {
            tijd: datumTijd,
            inhoud: tekst
        };

        let opgeslagen = JSON.parse(localStorage.getItem('eetMomenten')) || [];
        opgeslagen.unshift(nuEersteItemOfVoegToe(nieuweItem, opgeslagen));
        
        // Sla op
        localStorage.setItem('eetMomenten', JSON.stringify(opgeslagen));
        
        input.value = '';
        laadEten();
    }

    function nuEersteItemOfVoegToe(item, lijst) {
        lijst.unshift(item);
        return lijst;
    }

    function laadEten() {
        const container = document.getElementById('lijstContainer');
        const opgeslagen = JSON.parse(localStorage.getItem('eetMomenten')) || [];
        
        if (opgeslagen.length === 0) {
            container.innerHTML = '<p style="color: #777; text-align: center;">Nog niets genoteerd vandaag.</p>';
            return;
        }

        let html = '';
        opgeslagen.forEach((item, index) => {
            html += `
                <div class="entry">
                    <div class="entry-time">${item.tijd}</div>
                    <div class="entry-text">${escapeHtml(item.inhoud)}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function wisAlles() {
        if (confirm("Weet je zeker dat je al je notities wilt wissen?")) {
            localStorage.removeItem('eetMomenten');
            laadEten();
        }
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
