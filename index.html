<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Eetdagboek</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Eetdagboek">

    <!-- JsPDF bibliotheek voor het maken van de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            margin-top: 10px;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background: #fff;
        }
        textarea {
            height: 90px;
            resize: vertical;
        }
        button {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active {
            background: #219653;
        }
        .btn-pdf {
            background: #2980b9;
            margin-top: 10px;
        }
        .entry {
            background: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid #27ae60;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .entry-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .entry-moment {
            font-weight: bold;
            color: #2c3e50;
        }
        .entry-text {
            font-size: 16px;
            white-space: pre-wrap;
            margin-bottom: 8px;
        }
        .entry-actions {
            display: flex;
            gap: 10px;
        }
        .entry-actions button {
            padding: 5px 10px;
            font-size: 12px;
            margin: 0;
            width: auto;
        }
        .btn-edit { background: #f39c12; }
        .btn-delete { background: #e74c3c; }
        
        .filters {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <h2>Mijn Eetdagboek</h2>

    <!-- Invoer Formulier -->
    <div class="card">
        <input type="hidden" id="editIndex" value="">
        
        <label for="momentSelect">Wanneer?</label>
        <select id="momentSelect">
            <option value="Ontbijt">Ontbijt</option>
            <option value="Lunch">Lunch</option>
            <option value="Avondeten">Avondeten</option>
            <option value="Tussendoor">Tussendoor</option>
        </select>

        <label for="etenInput">Wat heb je gegeten / gedronken?</label>
        <textarea id="etenInput" placeholder="Typ hier wat je hebt genuttigd..."></textarea>
        
        <button id="saveBtn" onclick="slaEtenOp()">Opslaan</button>
    </div>

    <!-- Filter / PDF Export Optie -->
    <div class="filters">
        <label>PDF Rapport Periode</label>
        <div style="display: flex; gap: 10px;">
            <input type="date" id="startDatum" style="flex:1; padding:8px; border-radius:6px; border:1px solid #ccc;">
            <input type="date" id="eindDatum" style="flex:1; padding:8px; border-radius:6px; border:1px solid #ccc;">
        </div>
        <button class="btn-pdf" onclick="genereerPDF()">Download PDF overzicht</button>
    </div>

    <h3>Overzicht van vandaag</h3>
    <div id="lijstContainer"></div>

<script>
    // PWA Service Worker registreren
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
            .then(() => console.log("Service Worker geregistreerd!"))
            .catch(err => console.log("Service Worker mislukt: ", err));
    }

    document.addEventListener("DOMContentLoaded", () => {
        checkMidnightReset();
        laadEten();
        
        const vandaag = new Date().toISOString().split('T')[0];
        document.getElementById('startDatum').value = vandaag;
        document.getElementById('eindDatum').value = vandaag;
    });

    function checkMidnightReset() {
        const laatsteDatum = localStorage.getItem('laatsteActieveDatum');
        const vandaag = new Date().toDateString();

        if (laatsteDatum !== vandaag) {
            archiveerHuidigeDag();
            localStorage.setItem('laatsteActieveDatum', vandaag);
        }
    }

    function archiveerHuidigeDag() {
        let huidig = JSON.parse(localStorage.getItem('eetMomenten')) || [];
        if (huidig.length > 0) {
            let archief = JSON.parse(localStorage.getItem('eetArchief')) || [];
            archief.push(...huidig);
            localStorage.setItem('eetArchief', JSON.stringify(archief));
            localStorage.removeItem('eetMomenten');
        }
    }

    function slaEtenOp() {
        const moment = document.getElementById('momentSelect').value;
        const input = document.getElementById('etenInput');
        const tekst = input.value.trim();
        const editIndex = document.getElementById('editIndex').value;

        if (!tekst) {
            alert("Vul even in wat je hebt gegeten.");
            return;
        }

        const nu = new Date();
        const datumIso = nu.toISOString().split('T')[0];
        const tijdStr = nu.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        const datumTijdWeergave = `${nu.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })} om ${tijdStr}`;

        let opgeslagen = JSON.parse(localStorage.getItem('eetMomenten')) || [];

        if (editIndex === "") {
            const nieuwItem = {
                id: Date.now(),
                datumIso: datumIso,
                tijd: datumTijdWeergave,
                moment: moment,
                inhoud: tekst
            };
            opgeslagen.unshift(nieuwItem);
        } else {
            opgeslagen[editIndex].moment = moment;
            opgeslagen[editIndex].inhoud = tekst;
            document.getElementById('editIndex').value = "";
            document.getElementById('saveBtn').innerText = "Opslaan";
        }

        localStorage.setItem('eetMomenten', JSON.stringify(opgeslagen));
        
        input.value = '';
        laadEten();
    }

    function laadEten() {
        const container = document.getElementById('lijstContainer');
        const opgeslagen = JSON.parse(localStorage.getItem('eetMomenten')) || [];
        
        if (opgeslagen.length === 0) {
            container.innerHTML = '<p style="color: #777; text-align: center;">Nog niets genoteerd voor vandaag.</p>';
            return;
        }

        let html = '';
        opgeslagen.forEach((item, index) => {
            html += `
                <div class="entry">
                    <div class="entry-header">
                        <span class="entry-moment">${item.moment}</span>
                        <span>${item.tijd}</span>
                    </div>
                    <div class="entry-text">${escapeHtml(item.inhoud)}</div>
                    <div class="entry-actions">
                        <button class="btn-edit" onclick="bewerkItem(${index})">Bewerk</button>
                        <button class="btn-delete" onclick="verwijderItem(${index})">Verwijder</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function bewerkItem(index) {
        let opgeslagen = JSON.parse(localStorage.getItem('eetMomenten')) || [];
        let item = opgeslagen[index];

        document.getElementById('momentSelect').value = item.moment;
        document.getElementById('etenInput').value = item.inhoud;
        document.getElementById('editIndex').value = index;
        document.getElementById('saveBtn').innerText = "Wijziging Opslaan";
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function verwijderItem(index) {
        if (confirm("Weet je zeker dat je dit wilt verwijderen?")) {
            let opgeslagen = JSON.parse(localStorage.getItem('eetMomenten')) || [];
            opgeslagen.splice(index, 1);
            localStorage.setItem('eetMomenten', JSON.stringify(opgeslagen));
            laadEten();
        }
    }

    function genereerPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const start = document.getElementById('startDatum').value;
        const eind = document.getElementById('eindDatum').value;

        if (!start || !eind) {
            alert("Selecteer een start- en einddatum voor de PDF.");
            return;
        }

        let actueel = JSON.parse(localStorage.getItem('eetMomenten')) || [];
        let archief = JSON.parse(localStorage.getItem('eetArchief')) || [];
        let alleItems = [...actueel, ...archief];

        let gefilterd = alleItems.filter(item => {
            return item.datumIso >= start && item.datumIso <= eind;
        });

        if (gefilterd.length === 0) {
            alert("Geen gegevens gevonden in deze periode.");
            return;
        }

        doc.setFontSize(18);
        doc.text("Eetdagboek Overzicht", 14, 20);
        
        doc.setFontSize(11);
        doc.setTextColor(100);
        doc.text(`Periode: ${start} tot ${eind}`, 14, 28);

        let y = 38;
        doc.setTextColor(0);

        gefilterd.forEach((item) => {
            if (y > 270) {
                doc.addPage();
                y = 20;
            }

            doc.setFont(undefined, 'bold');
            doc.text(`${item.tijd} - [${item.moment}]`, 14, y);
            y += 6;

            doc.setFont(undefined, 'normal');
            let splitText = doc.splitTextToSize(item.inhoud, 180);
            doc.text(splitText, 14, y);
            y += (splitText.length * 6) + 6;
        });

        doc.save(`eetdagboek_${start}_tot_${eind}.pdf`);
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
